name: atSpoke
description: 'atSpoke was a modern workplace service desk / internal helpdesk SaaS (formerly askSpoke)
  that let teams triage and resolve employee support requests across HR, IT, and operations. It was a
  portfolio company of Accel and was acquired by Okta in August 2021 for approximately $90M to seed
  Okta''s identity governance (IGA) roadmap. The standalone atSpoke product and its entire domain
  footprint have since been sunset: atspoke.com, askspoke.com, help.atspoke.com and the former public
  API host api.askspoke.com/api/v1 no longer resolve or serve. This profile is retained as a historical
  network record; there is no live developer surface left to enrich.'
